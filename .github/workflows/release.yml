# Gera o instalador do app de Windows e publica o release no GitHub a cada tag v*.
# Usa o GITHUB_TOKEN do próprio Actions: ninguém precisa criar token pessoal.
name: Release do app de Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes da engine de vídeo (sem ffmpeg o teste de render é pulado)
        run: npm test

      # cria o release antes dos uploads: o electron-builder envia os arquivos em paralelo e,
      # sem um release existente, cada envio criava o seu (releases duplicados na mesma tag)
      - name: Criar o release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" --title "Office $GITHUB_REF_NAME" --generate-notes

      - name: Gerar o instalador e enviar os arquivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -w @office/desktop

      - name: Conferir os arquivos do release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in latest.yml ".exe" ".blockmap"; do echo "$assets" | grep -q -- "$f" || { echo "faltou $f"; exit 1; }; done
